<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs>
    <style>
      .title { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .h { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .t { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: #374151; }
      .node { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 16; }
      .critical { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; rx: 16; }
      .safe { fill: #dcfce7; stroke: #15803d; stroke-width: 2; rx: 16; }
      .arrow { stroke: #1f2937; stroke-width: 2.5; marker-end: url(#a); fill: none; }
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
    </marker>
  </defs>

  <text x="35" y="52" class="title">Agent Decision Loop and Guardrail Flow</text>

  <rect class="node" x="80" y="120" width="230" height="110"/>
  <text x="100" y="155" class="h">User Query</text>
  <text x="100" y="182" class="t">Message + session context</text>

  <rect class="node" x="360" y="120" width="230" height="110"/>
  <text x="380" y="155" class="h">Infer Intent</text>
  <text x="380" y="182" class="t">summary / skills / fit / etc.</text>

  <rect class="node" x="640" y="120" width="230" height="110"/>
  <text x="660" y="155" class="h">Tool Selection</text>
  <text x="660" y="182" class="t">Use skill matcher if required</text>

  <rect class="critical" x="920" y="120" width="230" height="110"/>
  <text x="940" y="155" class="h">Guardrail Check</text>
  <text x="940" y="182" class="t">No fabrication allowed</text>

  <rect class="node" x="210" y="340" width="300" height="130"/>
  <text x="230" y="378" class="h">LLM Attempt (Gemini)</text>
  <text x="230" y="405" class="t">Prompt includes strict role + memory</text>
  <text x="230" y="430" class="t">Expect JSON schema output</text>

  <rect class="critical" x="580" y="340" width="300" height="130"/>
  <text x="600" y="378" class="h">If LLM Fails / Invalid JSON</text>
  <text x="600" y="405" class="t">Switch to deterministic fallback</text>
  <text x="600" y="430" class="t">Answer from parsed resume only</text>

  <rect class="safe" x="420" y="530" width="360" height="120"/>
  <text x="440" y="568" class="h">Final Structured Response</text>
  <text x="440" y="596" class="t">answer + confidence + source + missing_data</text>
  <text x="440" y="620" class="t">Includes "Not mentioned in resume" when needed</text>

  <line class="arrow" x1="310" y1="175" x2="360" y2="175"/>
  <line class="arrow" x1="590" y1="175" x2="640" y2="175"/>
  <line class="arrow" x1="870" y1="175" x2="920" y2="175"/>
  <line class="arrow" x1="1035" y1="230" x2="780" y2="340"/>
  <line class="arrow" x1="920" y1="175" x2="510" y2="340"/>
  <line class="arrow" x1="510" y1="470" x2="510" y2="530"/>
  <line class="arrow" x1="730" y1="470" x2="730" y2="530"/>

  <text x="35" y="665" class="t">This loop ensures reliability first: tool-grounded facts + explicit missing data + deterministic fallback.</text>
</svg>
